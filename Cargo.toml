[workspace]
members = ["crates/funbuild-core", "crates/funbuild"]
resolver = "2"

[workspace.package]
version = "1.6.102"
edition = "2021"
license = "MIT"
repository = "https://github.com/farfarfun/funbuild"
rust-version = "1.82"

[workspace.dependencies]
funbuild-core = { path = "crates/funbuild-core" }
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"
regex = "1"
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
shell-escape = "0.1"
tempfile = "3"
thiserror = "2"
toml_edit = "0.25"
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
