name: Release

# PyPI 只分发纯 Python 兼容模块；Rust 命令由独立二进制、apt、brew 和 crates.io
# 分发。两边同号，由 tag 触发构建和发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 版本号有两个来源（pyproject.toml 和根 Cargo.toml 的 [workspace.package]），
  # funbuild 发版时会把两边写成一致，对不上说明发版流程出了岔子。
  check:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        # 根 Cargo.toml 是纯虚拟工作区，第一个行首 `version = ` 就是
        # [workspace.package] 的那个；pyproject.toml 的第一个是 [project].version。
        run: |
          set -eu
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          python_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ -z "$cargo_version" ] || [ -z "$python_version" ]; then
            echo "::error::读不出版本号 (Cargo=${cargo_version} pyproject=${python_version})"
            exit 1
          fi
          if [ "$cargo_version" != "$python_version" ]; then
            echo "::error::Cargo.toml 的 ${cargo_version} 和 pyproject.toml 的 ${python_version} 对不上"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${cargo_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 和清单里的 ${cargo_version} 对不上"
            exit 1
          fi
          echo "version=${cargo_version}" >>"$GITHUB_OUTPUT"

  wheels:
    name: Python wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv build --out-dir dist

      - name: Smoke test
        shell: bash
        run: |
          set -eux
          python -m venv .smoke
          .smoke/bin/pip install --find-links dist --no-index --no-deps funbuild
          test ! -e .smoke/bin/funbuild
          .smoke/bin/python -c "from funbuild.tool.fastapi import ApiRoute, add_api_routes, api_route"
          .smoke/bin/python -c "import importlib.resources as r; assert (r.files('funbuild') / 'py.typed').is_file()"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python
          path: dist

  # CLI 二进制单独构建：它的价值就在于「不用装 Python」，所以必须是能直接下载运行
  # 的独立文件，而不是藏在 wheel 里。apt / brew 两条渠道也从这里取料。
  binaries:
    name: cli (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # gnu 两个保留裸二进制：README 里 releases/latest/download/... 是公开地址。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # musl 全静态：.deb 不写库依赖、Homebrew 的 Linux 瓶子、以及推荐给老发行版的
          # tarball 都用它。funbuild 的依赖树是纯 Rust（没有 OpenSSL 之类），所以静态
          # 构建不需要额外的 C 工具链。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tarball: "yes"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tarball: "yes"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            tarball: "yes"
          - runner: macos-latest
            target: aarch64-apple-darwin
            tarball: "yes"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --locked --package funbuild --target ${{ matrix.platform.target }}

      - name: Package
        shell: bash
        # tarball 必须在这个 job 里打：upload-artifact 不保留文件权限，裸文件到了下游
        # job 就是 0644 的，而 Homebrew 的 bin.install 和 .deb 都要可执行位。
        # 里面的文件名得是裸 funbuild —— formula 和 build-deb.sh 都按裸名取。
        run: |
          set -eu
          mkdir -p artifacts
          if [ -n "${{ matrix.platform.tarball }}" ]; then
            tar -czf "artifacts/funbuild-${{ matrix.platform.target }}.tar.gz" \
              -C "target/${{ matrix.platform.target }}/release" funbuild
          fi
          mv "target/${{ matrix.platform.target }}/release/funbuild" \
             "artifacts/funbuild-${{ matrix.platform.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.target }}
          path: artifacts

  # 打 .deb。不加 tag 条件，workflow_dispatch 时也跑：打包脚本坏了该在不发版的时候
  # 就红，而不是等到真发版。
  deb:
    name: deb (${{ matrix.arch }})
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl }
          - { arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: artifacts

      # 跨架构打包没问题：dpkg-deb 只是把文件装进去，Architecture 是 control 里的
      # 一个字段，不是构建属性。
      - name: Build .deb
        run: |
          set -eu
          sudo apt-get update -y && sudo apt-get install -y dpkg-dev
          mkdir -p stage
          tar -xzf "artifacts/funbuild-${{ matrix.target }}.tar.gz" -C stage
          bash packaging/build-deb.sh stage/funbuild \
            "${{ needs.check.outputs.version }}" "${{ matrix.arch }}" dist

      - name: Inspect
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    needs: [check, wheels, binaries, deb]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # contents: write 给下面那步往 GitHub Release 挂二进制
      # id-token: write 是 PyPI trusted publishing 要的 OIDC id-token
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: binaries
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      # 用 uv publish 而不是 maturin upload：后者不支持 trusted publishing，只认
      # MATURIN_PYPI_TOKEN / .pypirc。
      #
      # 前置条件：PyPI 的 funbuild 项目设置里登记本仓库为 trusted publisher，
      # workflow 填 release.yml、environment 留空（本 job 没有 environment:）。
      #
      # 写 always 而不是默认的 automatic：automatic 拿不到 id-token 时会静默退回去
      # 找 token，配置错了要等到真实发版才暴露。always 直接失败。
      #
      # --check-url 让重跑变成幂等的：传到一半挂了，重跑会跳过已经在 PyPI 上的文件。
      - name: Publish to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            dist/*

      # 校验和清单最后生成：它要覆盖上面所有附件，提前算就漏掉 .deb 和 tarball。
      # farfarfun/packages 渲染 Homebrew formula 时按裸文件名在这里查 sha256。
      - name: Generate SHA256SUMS
        working-directory: binaries
        # 必须是块标量：单行 run 是 YAML 的普通标量，空格后的 # 会被当成注释，命令
        # 会从 sed 的分隔符处被截断。
        #
        # 用 ./* 而不是 *：文件名以 - 开头时后者会被 sha256sum 当成选项。多出来的
        # ./ 前缀要去掉，formula 是按裸文件名查的。
        run: |
          sha256sum ./* | sed 's|\./||' >SHA256SUMS
          cat SHA256SUMS

      - name: Attach the CLI binaries, tarballs and .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  # crates.io 发布，和 PyPI 那边分成两个 job：两个 registry 的失败互不牵连。
  crates:
    needs: [check, wheels]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # 只是允许向 GitHub 索要 OIDC id-token。cargo 自己不做 OIDC 交换，得靠下面
      # 那个 action 把 id-token 换成 crates.io 的短期令牌。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # cargo publish 没有 PyPI 的 --check-url 那种幂等开关，版本已存在就硬失败。
      # 所以先查 crates.io 再决定发不发：重跑一次发到一半挂掉的发版时需要这个。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "funbuild") | .version')"
          if [ -z "${version}" ]; then
            echo "::error::在 cargo metadata 里找不到 funbuild"
            exit 1
          fi
          if curl -sfo /dev/null \
              -H 'User-Agent: farfarfun-funbuild-release' \
              "https://crates.io/api/v1/crates/funbuild/${version}"; then
            echo "funbuild ${version} 已在 crates.io，跳过"
            exit 0
          fi
          echo "发布 funbuild ${version}"
          cargo publish -p funbuild --locked

  # 装机验证只能放在发布之后：下面装的是真的从 PyPI 下来的那一版。这一步红了说明
  # 刚发出去的版本装不上，得立刻补一个。
  verify-install:
    name: verify (${{ matrix.os }})
    needs: [check, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 验证 PyPI 包只提供兼容模块，不会抢占独立二进制的命令名。
      - name: Install Python module from PyPI
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          python -m venv .verify
          # publish 刚完成几十秒，PyPI 的 simple index 带 CDN 缓存，pip 往往还看不到
          # 新版本。重试而不是一装就断言——否则这个 job 的成败取决于 CDN 快慢。
          for attempt in $(seq 1 20); do
            if .verify/bin/pip install --only-binary funbuild "funbuild==${VERSION}"; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "::error::等了 5 分钟 PyPI 上仍看不到 ${VERSION}"
              exit 1
            fi
            echo "PyPI 索引还没更新，15s 后重试 (${attempt}/20)"
            sleep 15
          done
          set -x
          test ! -e .verify/bin/funbuild
          .verify/bin/python -c "from funbuild.tool.fastapi import ApiRoute"
