[build-system]
requires = [ "setuptools>=77",]
build-backend = "setuptools.build_meta"

[project]
name = "nltbuild"
version = "1.6.64"
description = "Python / 前端仓库的一键发版工具：版本递增、构建、发布、打 tag，自动适配 uv / Poetry / npm"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = [ "LICENSE",]
dependencies = [ "uv>=0.8.4", "tomlkit>=0.13.2", "typer-slim", "nltlog>=1.0.11", "funshell>=1.0.2",]
keywords = [ "build", "requirements", "packaging", "uv",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.scripts]
nltbuild = "nltbuild.core:nltbuild"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/nltbuild"
Releases = "https://github.com/farfarfun/nltbuild/releases"

[dependency-groups]
dev = [ "pytest>=8", "ruff>=0.12.7",]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.pytest.ini_options]
testpaths = [ "tests",]

[tool.uv]
package = true

[tool.ruff.lint]
select = [ "I", "E", "W", "B", "F", "UP", "RUF", "PL",]
fixable = [ "I",]
ignore = [ "E501", "UP006", "UP007", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",]
