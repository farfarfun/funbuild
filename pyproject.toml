[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "funbuild"
version = "1.6.108"
description = "Python / 前端 / Flutter / Rust 仓库的一键发版工具：版本递增、构建、发布、打 tag，自动适配 uv / Poetry / npm / Flutter / Cargo"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [ "build", "requirements", "packaging", "uv", "rust",]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Rust",
]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funbuild"
Releases = "https://github.com/farfarfun/funbuild/releases"

[dependency-groups]
dev = [ "ruff>=0.12.7",]

[tool.maturin]
# 本地发版仍需同步 Cargo 版本，并由 tag 触发 CI 发布；不作为 Python 构建后端。
manifest-path = "crates/funbuild/Cargo.toml"

[tool.hatch.build.targets.wheel]
packages = ["src/funbuild"]

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py312"

[tool.uv]
package = true

[tool.ruff.lint]
select = [ "I", "E", "W", "B", "F", "UP", "RUF", "PL",]
fixable = [ "I",]
ignore = [ "E501", "UP006", "UP007", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF003",]
