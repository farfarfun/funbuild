[build-system]
requires = [ "setuptools>=77",]
build-backend = "setuptools.build_meta"

[project]
name = "funbuild"
version = "1.6.75"
description = "Python / 前端 / Flutter 仓库的一键发版工具：版本递增、构建、发布、打 tag，自动适配 uv / Poetry / npm / Flutter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "uv>=0.8.4", "tomlkit>=0.13.2", "pyyaml>=6.0", "typer-slim>=0.24.0", "farlog>=1.0.11", "funshell>=1.0.2",]
keywords = [ "build", "requirements", "packaging", "uv",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funbuild = "funbuild.core:funbuild"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funbuild"
Releases = "https://github.com/farfarfun/funbuild/releases"

[dependency-groups]
dev = [ "pytest>=8", "ruff>=0.12.7",]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.pytest.ini_options]
testpaths = [ "tests",]
# 必须显式指向 src: 否则 pytest 会 import 到全局装着的 funbuild, 测的是已发布的
# 旧版本而不是工作区代码——改动跑绿了也毫无意义。
pythonpath = [ "src",]

[tool.uv]
package = true

[tool.setuptools.package-data]
funbuild = ["py.typed"]

[tool.ruff.lint]
select = [ "I", "E", "W", "B", "F", "UP", "RUF", "PL",]
fixable = [ "I",]
ignore = [ "E501", "UP006", "UP007", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",]
