[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "funbuild"
version = "1.6.104"
description = "Python / 前端 / Flutter / Rust 仓库的一键发版工具：版本递增、构建、发布、打 tag，自动适配 uv / Poetry / npm / Flutter / Cargo"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# 实现全在 Rust 二进制里；留着 uv 是因为发版流程要调它
dependencies = [ "uv>=0.12.23",]
keywords = [ "build", "requirements", "packaging", "uv", "rust",]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Rust",
]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

# 刻意没有 [project.scripts]：bin 模式下两者同时存在时 maturin 会拒绝构建
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funbuild"
Releases = "https://github.com/farfarfun/funbuild/releases"

[dependency-groups]
dev = [ "maturin>=1.7,<2", "ruff>=0.12.7",]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/funbuild/Cargo.toml"
python-source = "src"
strip = true

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py312"

[tool.uv]
package = true

[tool.ruff.lint]
select = [ "I", "E", "W", "B", "F", "UP", "RUF", "PL",]
fixable = [ "I",]
ignore = [ "E501", "UP006", "UP007", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF003",]
